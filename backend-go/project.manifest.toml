schema_version = 1

[project]
service_id = "backend-go"
name = "Go Backend"
type = "go"

[build]
command = ["sh", "scripts/build-standalone.sh"]
artifact = "artifact.zip"

[run]
command = ["./server"]

# The service opens PostgreSQL during startup even without a migrate command.
# app-cli probes this service's database before launching the process.
[env]
APP_CLI_REQUIRE_PG = "1"

# startup/liveness 用默认 /health；readiness 走更深的 /ready（DB 等依赖检查）。
[health]
readiness_path = "/ready"

[proxy]
path = "/api/go/"
strip_prefix = true

[[logs.sources]]
id = "application"
glob = "backend-go*.log*"
format = "jsonl"
