schema_version = 1

[project]
service_id = "userapp-next"
name = "Next.js Full-stack App"
type = "node"
kind = "web"
enabled = true

[build]
command = ["npm", "run", "build:standalone"]
artifact = "userapp-next-standalone.zip"

[run]
command = ["node", "server.js"]
migrate = ["node", "migrate.js"]
depends_on = []
shutdown_timeout_seconds = 30

[health]
startup_path = "/"
readiness_path = "/api/health"
liveness_path = "/"

[proxy]
path = "/"
strip_prefix = false
plugins = []
upstream_includes = []

[[logs.sources]]
id = "runtime"
glob = "runtime.*.log"
format = "text"
