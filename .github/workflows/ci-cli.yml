name: CI CLI

# 日常 CI:push / PR 时跑编译 + pack + E2E 测试(不发布)
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
    paths:
      - 'cli/**'
      - 'backend-go/**'
      - 'backend-java/**'
      - 'backend-python/**'
      - 'backend-rust/**'
      - 'frontend-react-vite/**'
      - 'frontend-vue3-vite/**'
      - 'userapp-next-template/**'
      - '.github/workflows/ci-cli.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'backend-go/**'
      - 'backend-java/**'
      - 'backend-python/**'
      - 'backend-rust/**'
      - 'frontend-react-vite/**'
      - 'frontend-vue3-vite/**'
      - 'userapp-next-template/**'

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Pack templates
        working-directory: cli
        run: npm run pack

      - name: Build
        working-directory: cli
        run: npm run build

      - name: Smoke test (list)
        working-directory: cli
        run: node dist/index.js list

      - name: E2E test (init + add + conflict detection)
        run: |
          set -e
          CLI="node $(pwd)/cli/dist/index.js"
          WORKDIR="$(mktemp -d)"

          echo "=== init: go + react ==="
          $CLI init "$WORKDIR/test-app" --backend go --frontend react
          test -f "$WORKDIR/test-app/workspace.manifest.toml"
          grep -q 'service_id = "backend-go"' "$WORKDIR/test-app/backend-go/project.manifest.toml"
          grep -q 'path = "/api/go/"' "$WORKDIR/test-app/backend-go/project.manifest.toml"

          echo "=== add: rust with custom service_id ==="
          cd "$WORKDIR/test-app"
          $CLI add backend-rust --service-id my-rust-api --path /api/rust-v2/
          grep -q 'name = "my-rust-api"' "$WORKDIR/test-app/my-rust-api/Cargo.toml"

          echo "=== conflict detection ==="
          if $CLI add backend-go 2>/dev/null; then
            echo "ERROR: 应该拒绝重复"; exit 1
          fi

          echo "✓ CI 测试全部通过"
