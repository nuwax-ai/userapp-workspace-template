name: CI CLI

# 日常 CI:push / PR 时跑编译 + pack + E2E 测试(不发布)
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
    paths:
      - 'cli/**'
      - 'backend-go/**'
      - 'backend-java/**'
      - 'backend-python/**'
      - 'backend-rust/**'
      - 'frontend-react-vite/**'
      - 'frontend-vue3-vite/**'
      - 'userapp-next-template/**'
      - '.github/workflows/ci-cli.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'backend-go/**'
      - 'backend-java/**'
      - 'backend-python/**'
      - 'backend-rust/**'
      - 'frontend-react-vite/**'
      - 'frontend-vue3-vite/**'
      - 'userapp-next-template/**'

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Pack templates
        working-directory: cli
        run: npm run pack

      - name: Build
        working-directory: cli
        run: npm run build

      - name: Smoke test (list + docs)
        working-directory: cli
        run: |
          node dist/index.js list
          node dist/index.js docs

      - name: E2E test (init + add + worker + conflict detection)
        run: |
          set -e
          CLI="node $(pwd)/cli/dist/index.js"
          WORKDIR="$(mktemp -d)"

          echo "=== init: go + react ==="
          $CLI init "$WORKDIR/test-app" --backend go --frontend react
          test -f "$WORKDIR/test-app/workspace.manifest.toml"
          grep -q 'service_id = "backend-go"' "$WORKDIR/test-app/backend-go/project.manifest.toml"
          grep -q 'path = "/api/go/"' "$WORKDIR/test-app/backend-go/project.manifest.toml"

          echo "=== workspace manifest has comment template ==="
          grep -q '\[pingap\]' "$WORKDIR/test-app/workspace.manifest.toml"
          grep -q 'bridge_service' "$WORKDIR/test-app/workspace.manifest.toml"

          echo "=== add: rust with custom service_id ==="
          cd "$WORKDIR/test-app"
          $CLI add backend-rust --service-id my-rust-api --path /api/rust-v2/
          grep -q 'name = "my-rust-api"' "$WORKDIR/test-app/my-rust-api/Cargo.toml"
          grep -q '"axum", "vendored"' "$WORKDIR/test-app/my-rust-api/Cargo.toml"
          grep -q 'maven.aliyun.com' "$GITHUB_WORKSPACE/cli/templates/backend-java/.mvn/wrapper/maven-wrapper.properties"

          echo "=== add: worker (no [proxy], kind=worker) ==="
          $CLI add backend-python --kind worker --service-id bg-worker
          grep -q 'kind = "worker"' "$WORKDIR/test-app/bg-worker/project.manifest.toml"
          if grep -q '\[proxy\]' "$WORKDIR/test-app/bg-worker/project.manifest.toml"; then
            echo "ERROR: worker 不应有 [proxy] 段"; exit 1
          fi

          echo "=== AGENTS.md generated ==="
          test -f "$WORKDIR/test-app/AGENTS.md"
          grep -q 'npx skills add nuwax-ai/userapp-workspace-template' "$WORKDIR/test-app/AGENTS.md"

          echo "=== init: react custom service_id + path (pack placeholder + VITE_BASE derive) ==="
          # 注:此处已 cd 到 $WORKDIR/test-app,仓库文件必须用 $GITHUB_WORKSPACE 绝对路径
          grep -q '__VITE_BASE__' "$GITHUB_WORKSPACE/cli/templates/frontend-react-vite/vite.config.ts"
          $CLI init "$WORKDIR/test-web" --frontend react --service-id my-web --path /admin/
          grep -q "base: command === 'serve' ? '/' : '/admin/'" "$WORKDIR/test-web/my-web/vite.config.ts"
          grep -q 'service_id = "my-web"' "$WORKDIR/test-web/my-web/project.manifest.toml"
          grep -q 'path = "/admin/"' "$WORKDIR/test-web/my-web/project.manifest.toml"
          grep -q 'type = "static"' "$WORKDIR/test-web/my-web/project.manifest.toml"

          echo "=== conflict detection ==="
          if $CLI add backend-go 2>/dev/null; then
            echo "ERROR: 应该拒绝重复"; exit 1
          fi

          echo "=== init: next fullstack ==="
          $CLI init "$WORKDIR/test-next" --next
          grep -q 'migrate' "$WORKDIR/test-next/userapp-next/project.manifest.toml"
          grep -q 'userapp-next-standalone.zip' "$WORKDIR/test-next/userapp-next/project.manifest.toml"
          grep -q '"geist"' "$WORKDIR/test-next/userapp-next/package.json"

          echo "✓ CI 测试全部通过"
