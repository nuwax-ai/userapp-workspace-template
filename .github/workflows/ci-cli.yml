name: CI CLI

# 日常 CI:push / PR 时跑编译 + pack + E2E 测试(不发布)
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
    paths:
      - 'cli/**'
      - 'database/**'
      - 'backend-go/**'
      - 'backend-java/**'
      - 'backend-python/**'
      - 'backend-rust/**'
      - 'frontend-react-vite/**'
      - 'frontend-vue3-vite/**'
      - 'userapp-next-template/**'
      - '.github/workflows/ci-cli.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'database/**'
      - 'backend-go/**'
      - 'backend-java/**'
      - 'backend-python/**'
      - 'backend-rust/**'
      - 'frontend-react-vite/**'
      - 'frontend-vue3-vite/**'
      - 'userapp-next-template/**'

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Pack templates
        working-directory: cli
        run: npm run pack

      - name: Build
        working-directory: cli
        run: npm run build

      - name: Test generated workspaces
        working-directory: cli
        run: npm test
