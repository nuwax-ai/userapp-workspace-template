name: Release CLI

# 触发条件:
#   1. 推送 v* 标签 → 发布到 npm(带 tag latest)
#   2. workflow_dispatch(手动)→ 可选择 prerelease
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      npm_tag:
        description: 'npm dist-tag (latest / next / beta)'
        required: true
        default: 'next'

permissions:
  contents: read

jobs:
  release:
    name: Build & Publish to npm
    runs-on: ubuntu-latest

    # 只在 cli/ 目录有内容时运行(仓库根可能只是模板开发用)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          # scope 配置:@nuwax-ai 组织包
          scope: '@nuwax-ai'

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      # pack-templates.mjs 从仓库根的各子目录读取模板源,注入占位符,打包到 cli/templates/
      - name: Pack templates
        working-directory: cli
        run: npm run pack

      - name: Verify packed templates
        run: |
          echo "=== 打包结果 ==="
          for d in cli/templates/*/; do
            count=$(find "$d" -type f | wc -l | tr -d ' ')
            echo "  $(basename $d): ${count} 文件"
          done

      - name: Build CLI
        working-directory: cli
        run: npm run build

      # 确认 CLI 能正常跑(list 命令做 smoke test)
      - name: Smoke test
        working-directory: cli
        run: node dist/index.js list

      # 端到端测试:init + add + 占位符替换验证
      - name: E2E test
        run: |
          set -e
          CLI="node $(pwd)/cli/dist/index.js"
          WORKDIR="$(mktemp -d)"

          echo "=== init: go + react ==="
          $CLI init "$WORKDIR/test-app" --backend go --frontend react
          test -f "$WORKDIR/test-app/workspace.manifest.toml"
          test -f "$WORKDIR/test-app/backend-go/project.manifest.toml"
          test -f "$WORKDIR/test-app/frontend-react-vite/project.manifest.toml"
          grep -q 'service_id = "backend-go"' "$WORKDIR/test-app/backend-go/project.manifest.toml"
          grep -q 'path = "/api/go/"' "$WORKDIR/test-app/backend-go/project.manifest.toml"

          echo "=== add: rust with custom service_id ==="
          cd "$WORKDIR/test-app"
          $CLI add backend-rust --service-id my-rust-api --path /api/rust-v2/
          test -f "$WORKDIR/test-app/my-rust-api/project.manifest.toml"
          grep -q 'service_id = "my-rust-api"' "$WORKDIR/test-app/my-rust-api/project.manifest.toml"
          grep -q 'name = "my-rust-api"' "$WORKDIR/test-app/my-rust-api/Cargo.toml"

          echo "=== conflict detection: duplicate service_id ==="
          if $CLI add backend-go 2>/dev/null; then
            echo "ERROR: 应该拒绝重复 service_id 但没拒绝"; exit 1
          else
            echo "✓ 正确拒绝了重复 service_id"
          fi

          echo "=== init: next fullstack ==="
          $CLI init "$WORKDIR/test-next" --next
          grep -q 'migrate' "$WORKDIR/test-next/userapp-next/project.manifest.toml"
          grep -q 'userapp-next-standalone.zip' "$WORKDIR/test-next/userapp-next/project.manifest.toml"

          echo "✓ 所有 E2E 测试通过"

      # 发布到 npm
      # 标签推送 → dist-tag = latest;手动触发 → 用 inputs.npm_tag
      - name: Publish to npm
        working-directory: cli
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npm publish --access public --tag latest
          else
            npm publish --access public --tag "${{ inputs.npm_tag }}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        working-directory: cli
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "### Published: \`$NAME@$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install: \`npx $NAME list\`" >> $GITHUB_STEP_SUMMARY
