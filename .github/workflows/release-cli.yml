name: Release CLI

# ─── Tag 规则 ──────────────────────────────────────────────
# 正式版:  v0.1.0          → npm publish --tag latest
# 测试版:  v0.1.0-beta.1   → npm publish --tag beta
#
# 版本号从 tag 名解析,CI 会自动同步到 cli/package.json,
# 所以你打 tag 时不需要手动改 package.json 的 version 字段。
#
# 常用流程:
#   git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1   # 发测试版
#   # 验证没问题后:
#   git tag v0.1.0 && git push origin v0.1.0                 # 发正式版
# ───────────────────────────────────────────────────────────

on:
  push:
    tags:
      # 正式版: v1.0.0 / v0.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+'
      # 测试版: v1.0.0-beta.1 / v0.2.0-alpha.3 / v1.0.0-rc.1
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(如 0.1.0 或 0.1.0-beta.1)'
        required: true
        default: '0.1.0-beta.1'

permissions:
  contents: read

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      dist_tag: ${{ steps.parse.outputs.dist_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@nuwax-ai'

      # ── 从 tag 名或手动输入解析版本号 + 判断是否 prerelease ──
      - name: Parse version from tag
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # tag 推送:GITHUB_REF = refs/tags/v0.1.0-beta.1
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # 手动触发:用 inputs.version
            TAG="v${{ inputs.version }}"
            # 去掉可能重复的 v 前缀
            TAG="v${TAG#v}"
          fi

          VERSION="${TAG#v}"                    # 去掉 v 前缀 → 0.1.0-beta.1
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📝 版本号: $VERSION"

          # 判断是否 prerelease(含 - 的就是)
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            # 提取 prerelease 标识: 0.1.0-beta.1 → beta
            PRE_ID=$(echo "$VERSION" | sed -n 's/.*-\([a-zA-Z]*\).*/\1/p')
            echo "dist_tag=${PRE_ID:-beta}" >> $GITHUB_OUTPUT
            echo "🏷️  dist-tag: ${PRE_ID:-beta} (测试版)"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "dist_tag=latest" >> $GITHUB_OUTPUT
            echo "🏷️  dist-tag: latest (正式版)"
          fi

      # ── 同步版本号到 package.json ──────────────────────────
      - name: Sync version to package.json
        working-directory: cli
        run: |
          npm version ${{ steps.parse.outputs.version }} --no-git-tag-version --allow-pre-releases
          echo "=== package.json version ==="
          node -p "require('./package.json').version"

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Pack templates
        working-directory: cli
        run: npm run pack

      - name: Verify packed templates
        run: |
          echo "=== 打包结果 ==="
          for d in cli/templates/*/; do
            count=$(find "$d" -type f | wc -l | tr -d ' ')
            echo "  $(basename $d): ${count} 文件"
          done

      - name: Build CLI
        working-directory: cli
        run: npm run build

      - name: Smoke test (list)
        working-directory: cli
        run: node dist/index.js list

      # ── 端到端测试 ─────────────────────────────────────────
      - name: E2E test
        run: |
          set -e
          CLI="node $(pwd)/cli/dist/index.js"
          WORKDIR="$(mktemp -d)"

          echo "=== init: go + react ==="
          $CLI init "$WORKDIR/test-app" --backend go --frontend react
          test -f "$WORKDIR/test-app/workspace.manifest.toml"
          grep -q 'service_id = "backend-go"' "$WORKDIR/test-app/backend-go/project.manifest.toml"
          grep -q 'path = "/api/go/"' "$WORKDIR/test-app/backend-go/project.manifest.toml"

          echo "=== add: rust with custom service_id ==="
          cd "$WORKDIR/test-app"
          $CLI add backend-rust --service-id my-rust-api --path /api/rust-v2/
          grep -q 'name = "my-rust-api"' "$WORKDIR/test-app/my-rust-api/Cargo.toml"

          echo "=== conflict detection ==="
          if $CLI add backend-go 2>/dev/null; then
            echo "ERROR: 应该拒绝重复"; exit 1
          fi

          echo "=== init: next fullstack ==="
          $CLI init "$WORKDIR/test-next" --next
          grep -q 'migrate' "$WORKDIR/test-next/userapp-next/project.manifest.toml"
          grep -q 'userapp-next-standalone.zip' "$WORKDIR/test-next/userapp-next/project.manifest.toml"

          echo "✓ 所有 E2E 测试通过"

      # ── 发布到 npm ─────────────────────────────────────────
      - name: Publish to npm
        working-directory: cli
        run: npm publish --access public --tag ${{ steps.parse.outputs.dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── 发布摘要 ───────────────────────────────────────────
      - name: Summary
        working-directory: cli
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          DIST_TAG="${{ steps.parse.outputs.dist_tag }}"
          PRERELEASE="${{ steps.parse.outputs.prerelease }}"

          if [ "$PRERELEASE" = "true" ]; then
            BADGE="🧪 测试版"
            INSTALL="npm install @nuwax-ai/cli@$DIST_TAG"
          else
            BADGE="🚀 正式版"
            INSTALL="npm install @nuwax-ai/cli"
          fi

          echo "### $BADGE \`@nuwax-ai/cli@$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 属性 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| npm dist-tag | \`$DIST_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 安装命令 | \`$INSTALL\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 使用 | \`npx @nuwax-ai/cli@$DIST_TAG list\` |" >> $GITHUB_STEP_SUMMARY
