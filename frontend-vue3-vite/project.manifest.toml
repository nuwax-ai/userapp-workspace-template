schema_version = 1

[project]
service_id = "frontend-vue3-vite"
name = "Vue Vite Frontend"
type = "node"
kind = "web"
enabled = true

[build]
command = ["sh", "scripts/build-standalone.sh"]
artifact = "artifact.zip"

[run]
command = ["node", "static-server.cjs"]
migrate = []
depends_on = []
shutdown_timeout_seconds = 30

[health]
startup_path = "/"
readiness_path = "/"
liveness_path = "/"

[proxy]
path = "/vue"
strip_prefix = true
plugins = []
upstream_includes = []

[[logs.sources]]
id = "runtime"
glob = "runtime.*.log"
format = "text"
