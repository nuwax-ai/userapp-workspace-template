schema_version = 1

[project]
service_id = "frontend-vue3-vite"
name = "Vue Vite Frontend"
type = "node"

[build]
command = ["sh", "scripts/build-standalone.sh"]
artifact = "artifact.zip"

[run]
command = ["node", "static-server.cjs"]

# static-server.cjs 显式处理 /health（返 JSON 200），不再靠 SPA fallback 当探针。
[health]
readiness_path = "/health"

[proxy]
path = "/vue"
strip_prefix = true

[[logs.sources]]
id = "runtime"
glob = "runtime.*.log"
format = "text"
