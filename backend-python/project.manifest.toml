schema_version = 1

[project]
service_id = "backend-python"
name = "Python Backend"
type = "python"

[build]
command = ["sh", "scripts/build-standalone.sh"]
artifact = "artifact.zip"

[run]
command = ["python3", "main.py"]

# Database readiness is required even without a migration command.
[env]
APP_CLI_REQUIRE_PG = "1"

# startup/liveness 用默认 /health；readiness 走更深的 /ready。
[health]
readiness_path = "/ready"

[proxy]
path = "/api/python/"
strip_prefix = true

[[logs.sources]]
id = "application"
glob = "backend-python.log*"
format = "text"
multiline_start_pattern = "^\\d{4}-\\d{2}-\\d{2}"
