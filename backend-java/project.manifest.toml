schema_version = 1

[project]
service_id = "backend-java"
name = "Java Backend"
type = "java"
kind = "web"
enabled = true

[build]
command = ["sh", "scripts/build-standalone.sh"]
artifact = "artifact.zip"

[run]
command = ["java", "-jar", "app.jar"]
migrate = []
depends_on = []
shutdown_timeout_seconds = 30

[health]
startup_path = "/actuator/health"
readiness_path = "/actuator/health/readiness"
liveness_path = "/actuator/health/liveness"

[proxy]
path = "/api/java/"
strip_prefix = true
plugins = []
upstream_includes = []

[[logs.sources]]
id = "application"
glob = "backend-java.log*"
format = "text"
multiline_start_pattern = "^\\d{4}-\\d{2}-\\d{2}"
