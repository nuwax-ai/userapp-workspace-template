schema_version = 1

[project]
service_id = "frontend-react-vite"
name = "React Vite Frontend"
type = "node"

[build]
command = ["sh", "scripts/build-standalone.sh"]
artifact = "artifact.zip"

[run]
command = ["node", "static-server.cjs"]

# 纯静态 SPA：static-server 对任意无扩展名路径 fallback 到 index.html（200），
# 故默认探针 /health 即可，无需声明 [health]。
[proxy]
path = "/react"
strip_prefix = true

[[logs.sources]]
id = "runtime"
glob = "runtime.*.log"
format = "text"
